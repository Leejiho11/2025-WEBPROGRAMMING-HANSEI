<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국 게임 통계 - 게임 추천 & 순위</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo"> 한국 게임 통계</a>
            <ul>
                <li><a href="index.html" class="active">홈</a></li>
                <li><a href="games.html">게임 목록</a></li>
                <li><a href="fps.html">FPS</a></li>
                <li><a href="mmorpg.html">MMORPG</a></li>
                <li><a href="moba.html">MOBA</a></li>
                <li><a href="contact.html">연락처</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="game-index-section">
            <div class="game-index-header">
                <h2> 오늘의 게임지수</h2>
                <span class="current-date" id="currentDate">2025.11.19</span>
            </div>
            <div class="index-cards">
                <div class="index-card">
                    <h3>게임지수</h3>
                    <div class="value">42.5</div>
                    <div class="change"> 6.8%</div>
                </div>
                <div class="index-card up">
                    <h3>상승 게임</h3>
                    <div class="value">4</div>
                    <div class="change">전일 대비</div>
                </div>
                <div class="index-card down">
                    <h3>하락 게임</h3>
                    <div class="value">2</div>
                    <div class="change">전일 대비</div>
                </div>
                <div class="index-card">
                    <h3>총 이용시간</h3>
                    <div class="value" style="font-size: 24px;">1,489만</div>
                    <div class="change">시간</div>
                </div>
            </div>
        </section>
        <section class="rankings-section">
            <div class="section-header">
                <h2> 게임 순위 TOP 10</h2>
            </div>
            <table class="rankings-table">
                <thead>
                    <tr>
                        <th>순위</th>
                        <th>게임명</th>
                        <th>장르</th>
                        <th>점유율</th>
                    </tr>
                </thead>
                <tbody id="rankingsTableBody">
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p> 2025 한국 게임 통계. 모든 권리 보유.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
