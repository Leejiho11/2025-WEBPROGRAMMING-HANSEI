    <script>
        // EmailJS 폼 제출 처리
        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const formNote = document.getElementById('formNote');
            
            // 버튼 로딩 상태
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline';
            
            // EmailJS로 이메일 전송
            // 실제 사용 시: emailjs.sendForm('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', this)
            emailjs.sendForm('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', this)
                .then(function(response) {
                    console.log('SUCCESS!', response.status, response.text);
                    
                    // 성공 메시지
                    formNote.innerHTML = '<p style="color: #10b981;">✅ 메시지가 성공적으로 전송되었습니다!</p>';
                    formNote.style.borderColor = '#10b981';
                    
                    // 폼 초기화
                    document.getElementById('contact-form').reset();
                    
                    // Toast 알림
                    if (window.ToastNotification) {
                        window.ToastNotification.show('메시지가 전송되었습니다! 🎉', 'success');
                    }
                    
                    // 버튼 복구
                    setTimeout(() => {
                        submitBtn.disabled = false;
                        btnText.style.display = 'inline';
                        btnLoader.style.display = 'none';
                    }, 2000);
                    
                }, function(error) {
                    console.log('FAILED...', error);
                    
                    // 실패 메시지 (EmailJS 미설정 시)
                    if (error.text === 'The user ID is invalid. Visit https://dashboard.emailjs.com/admin/integration') {
                        formNote.innerHTML = `
                            <p style="color: #f59e0b;">⚠️ EmailJS가 아직 설정되지 않았습니다.</p>
                            <p style="font-size: 12px; margin-top: 10px;">
                                <strong>설정 방법:</strong><br>
                                1. <a href="https://www.emailjs.com/" target="_blank" style="color: #4a90e2;">EmailJS</a>에 가입<br>
                                2. Service, Template 생성<br>
                                3. contact.html의 YOUR_PUBLIC_KEY, YOUR_SERVICE_ID, YOUR_TEMPLATE_ID 교체
                            </p>
                        `;
                    } else {
                        formNote.innerHTML = '<p style="color: #ef4444;">❌ 전송 실패. 다시 시도해주세요.</p>';
                    }
                    formNote.style.borderColor = '#ef4444';
                    
                    // Toast 알림
                    if (window.ToastNotification) {
                        window.ToastNotification.show('전송에 실패했습니다.', 'error');
                    }
                    
                    // 버튼 복구
                    submitBtn.disabled = false;
                    btnText.style.display = 'inline';
                    btnLoader.style.display = 'none';
                });
        });
    </script>
